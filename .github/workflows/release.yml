name: release

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
      - run: zig build fmt:check
      - run: zig build test --summary all

  tag:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      created: ${{ steps.extract.outputs.created }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: extract
        run: |
          # The version lives in build.zig.zon and nowhere else, so the tag is
          # derived from it instead of being maintained by hand.
          VERSION=$(awk '/\.version/{gsub(/"/, "", $3); gsub(/,/, "", $3); print $3}' build.zig.zon)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists — nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux, aarch64-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.version }}
      - uses: mlugg/setup-zig@v2
      # No libc and no dynamic loader: the artifact is the whole program.
      - run: zig build -Dtarget=${{ matrix.target }} --prefix zig-out-${{ matrix.target }}
      - run: |
          mv zig-out-${{ matrix.target }}/bin/prompty \
             zig-out-${{ matrix.target }}/bin/prompty-${{ matrix.target }}
          file zig-out-${{ matrix.target }}/bin/prompty-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: prompty-${{ matrix.target }}
          path: zig-out-${{ matrix.target }}/bin/prompty-${{ matrix.target }}
          if-no-files-found: error

  release:
    # It attaches the artifacts, so the build has to have finished first.
    needs: [tag, build]
    if: needs.tag.outputs.created == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.version }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: prompty-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum prompty-* > SHA256SUMS
          cat SHA256SUMS
      - name: Get previous tag
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          fromTag: ${{ steps.prev.outputs.prev }}
          toTag: ${{ needs.tag.outputs.version }}
          mode: "COMMIT"
          configurationJson: |
            {
              "pr_template": "- #{{TITLE}}",
              "categories": [
                {
                  "title": "## 🚨 Breaking Changes",
                  "labels": ["breaking"]
                },
                {
                  "title": "## 🚀 Feature",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "## 🐛 Fix",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "## ♻️ Refactor",
                  "labels": ["refactor"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test"]
                },
                {
                  "title": "## 💄 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 📝 Docs",
                  "labels": ["docs"]
                },
                {
                  "title": "## 🔨 Chore",
                  "labels": ["chore"]
                },
                {
                  "title": "## ⚡️ Performance",
                  "labels": ["perf"]
                },
                {
                  "title": "## 👷 CI",
                  "labels": ["ci"]
                }
              ],
              "label_extractor": [
                {
                  "pattern": ".*!.*|^breaking:.*",
                  "target": "breaking",
                  "on_property": "title"
                },
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(: ([\\w ])+([\\s\\S]*))?",
                  "target": "$1",
                  "on_property": "title"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          files: |
            dist/prompty-*
            dist/SHA256SUMS
          body: ${{ steps.changelog.outputs.changelog }}
