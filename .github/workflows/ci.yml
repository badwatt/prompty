name: ci

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: building and testing only needs to read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
      - name: Formatting
        run: zig build fmt:check
      - name: Tests
        run: zig build test --summary all
      - name: The hexagon's arrows
        run: zig build layers
      - name: Every command, in the shipping build
        run: zig build smoke
      - name: A render on a 64 KiB stack
        run: zig build stack

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
      # Ubuntu 24.04 has no kcov package ("Unable to locate package kcov"), and
      # the project's rule is 100% of lines, which used to be checked only by
      # whoever remembered to run it. kcov comes from nixpkgs, which the flake
      # already pins.
      - uses: nixbuild/nix-quick-install-action@v28
      - name: Install kcov
        run: nix profile install nixpkgs#kcov
      - name: Coverage
        run: zig build coverage -Dkcov="$(command -v kcov)"
