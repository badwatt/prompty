name: ci

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: building and testing only needs to read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
      - name: Formatting
        run: zig build fmt:check
      - name: Tests
        run: zig build test --summary all
